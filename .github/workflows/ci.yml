# CI: every push and pull request runs the backend e2e tests (fake LXD/Docker/PM2), the root-helper tests and the
# frontend build. Nothing here touches a real server.
name: CI
on:
  push:
    branches-ignore: [main] # main runs CI inside the Deploy workflow (tests first, then deploy)
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # The panel serves the built pages (landing, login) and the e2e tests request them: build the frontend first
      - name: Frontend build
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - name: Backend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || { grep -E '^✖|Error|expected|actual' test.log | head -20 | sed 's/^/::error::/'; exit 1; }
        working-directory: backend
      - name: Helper tests (backup, security, upgrade)
        run: node --test system/test/*.cjs
