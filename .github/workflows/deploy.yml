# CD: every push to main (e.g. a merged pull request) runs CI, then deploys.
# Which panel: the repository variable DEPLOY_TARGET (Settings -> Secrets and variables -> Actions -> Variables):
#   staging    = cloude.sampannatech.online (default when the variable is not set)
#   production = panel.kapilrajkc.com.np
# By hand: Actions -> Deploy -> Run workflow -> pick the panel.
# Both go through system/deploy.sh, which uses upgrade-panel.sh (automatic rollback if the new version fails).
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY        private key whose .pub is in kapil's ~/.ssh/authorized_keys on the server;
#                         easiest as one line: base64 -w0 ~/.ssh/kapil_cloud_deploy
#   DEPLOY_KNOWN_HOSTS    optional: extra known_hosts lines (the server's host key is pinned in this file)
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET   only if ssh.gyannportal.com is ever put behind a Cloudflare Access policy
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which panel
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.target || vars.DEPLOY_TARGET || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.event.inputs.target || vars.DEPLOY_TARGET || 'staging' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Secrets present?
        id: ready
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::DEPLOY_SSH_KEY is not set, skipping the deploy (see docs/CICD.md)"; echo "ok=no" >> "$GITHUB_OUTPUT"; else echo "ok=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Install cloudflared
        if: steps.ready.outputs.ok == 'yes'
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
      - name: SSH key
        if: steps.ready.outputs.ok == 'yes'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # DEPLOY_SSH_KEY may be the key as it is (BEGIN ... END lines) or ONE line of base64:  base64 -w0 ~/.ssh/kapil_cloud_deploy
          # Pasting problems are repaired: Windows line endings, literal \n, spaces around it.
          K=$(printf '%s' "$KEY" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          case "$K" in
            *"BEGIN "*"PRIVATE KEY"*) printf '%s\n' "$K" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key ;;
            *) printf '%s' "$K" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || true ;;
          esac
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            # never print the key itself, only what kind of text it looks like
            case "$K" in
              ssh-ed25519*|ssh-rsa*) hint="that is the PUBLIC key (.pub); use the private one" ;;
              "") hint="the secret is empty" ;;
              *"BEGIN "*) hint="BEGIN line found but the key body is broken ($(printf '%s\n' "$K" | wc -l) lines)" ;;
              *) hint="neither a key with BEGIN/END lines nor valid base64" ;;
            esac
            echo "::error::DEPLOY_SSH_KEY is not a usable private key ($hint). Easiest: on the dev PC run  base64 -w0 ~/.ssh/kapil_cloud_deploy  and paste that one line as the secret."
            exit 1
          fi
          # The server's host key is public, so it is pinned here; DEPLOY_KNOWN_HOSTS (optional) can add or replace it.
          printf '%s\n' "ssh.gyannportal.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEyqwU7L2fSz2jv1GcULW2mSgIJ9LyhPouEXyvEzF2s+" > ~/.ssh/known_hosts
          [ -z "$KNOWN" ] || printf '%s\n' "$KNOWN" | tr -d '\r' >> ~/.ssh/known_hosts
      - name: Deploy
        if: steps.ready.outputs.ok == 'yes'
        env:
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          TOKEN=""
          if [ -n "$CF_ID" ]; then TOKEN="--service-token-id $CF_ID --service-token-secret $CF_SECRET"; fi
          cat > ~/.ssh/config <<CONF
          Host ssh.gyannportal.com
            User kapil
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h $TOKEN
          CONF
          chmod 600 ~/.ssh/config
          bash system/deploy.sh "${{ github.event.inputs.target || vars.DEPLOY_TARGET || 'staging' }}"
